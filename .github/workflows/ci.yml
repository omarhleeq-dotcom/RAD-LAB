# Unit tests, typecheck, lint and production build only: no secrets, no Playwright, no deployment.
# The browser visual-regression matrix (scripts/qa/run-matrix.mjs) is run manually; see docs/session-5-qa.md.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the status transition check needs the fork point from the target branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run health:source
      - run: npm run health:test
      - run: npm test
        env:
          CI_TEST_LANE: unit
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the status transition check needs the fork point from the target branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Classify heavy rehearsals (PR only; unknown paths run full)
        id: rehearsals
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          // Only these reviewed audit/report paths cannot affect DB rehearsals.
          // supabase/**, scripts/**, all src, workflows/lock/config, phone packets,
          // docs read by code, renamed/deleted sensitive paths, and unknowns run full.
          const safe = new Set([
            'docs/TEST_AUDIT_REPORT_2026-11-02.md',
            'docs/TEST_AUDIT_INVENTORY_2026-11-02.json',
            'docs/TEST_CLEANUP_REPORT_2026-11-02.md',
          ]);
          let full = true;
          if (process.env.EVENT_NAME === 'pull_request') {
            try {
              const paths = execFileSync('git', ['diff', '--no-renames', '--name-only', '-z',
                `${process.env.BASE_SHA}...${process.env.HEAD_SHA}`], { encoding: 'utf8' }).split('\0').filter(Boolean);
              full = paths.length === 0 || paths.some(path => !safe.has(path));
            } catch { full = true; }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `full=${full}\n`);
          NODE
      - name: Required RAD-086 tools for the laptop backup tests (age, PostgreSQL 16 server and client; no skip)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age postgresql-16 postgresql-client-16
          age-keygen --version && pg_dump --version
      - name: Required RAD-086 Supabase vault and ICU restore image (no skip)
        run: docker pull supabase/postgres:17.11.0.016@sha256:6ce438c186e9f0a0aad707c2151cc0023e26bb7afd57e20080fdcd2bd76ba57d
      - name: Required synthetic Supabase vault restore proof (failure, never skip)
        run: node --test scripts/docs/laptop-icu.test.mjs
      - name: Required owner rehearsal on synthetic RAD-086 backup (pass and STOP teardown; no skip)
        if: steps.rehearsals.outputs.full == 'true'
        run: node --test scripts/assess/rad062-laptop-rehearsal.test.mjs scripts/assess/rad062-data-precheck.test.mjs
      - name: Required 0200 then 0300 window on synthetic encrypted RAD-086 backup (no skip)
        run: node --test scripts/assess/rad085-window-rehearsal.test.mjs
      - name: Required real CRLF production catalogue and 0200 to 0300 regression (empty RAD-086 backup; no skip)
        run: node --test scripts/assess/rad062-catalogue-rehearsal.test.mjs
      - name: Required P10 PostgreSQL 17.11 locale matrix image (no skip)
        run: docker pull postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
      - name: Prepare pinned isolated PostgreSQL (required, no skip)
        run: node scripts/assess/setup-rad085-postgres.mjs
      - name: Required RAD-059 phone emergency stop and monitoring (synthetic PostgreSQL)
        run: node --test scripts/assess/emergency-stop-rehearsal.test.mjs
      - name: Required RAD-085 pinned lock and cascading membership witnesses
        run: node --test scripts/assess/rad085-lock-witness.test.mjs
      - name: Required synthetic erasure recovery failures (no skip)
        run: node --test scripts/assess/rad085-erasure-recovery.test.mjs
      - name: Required RAD-085 local worker image and PostgreSQL witnesses (no skip)
        if: steps.rehearsals.outputs.full == 'true'
        run: node scripts/assess/rad085-worker-rehearsal.mjs
      - name: Required W1-W3 grading worker rehearsal (embedded, pinned 17.11, Supabase 17.11; no skip)
        run: node --test scripts/assess/grading-worker-rehearsal.test.mjs
      - name: Required W4 production grading image rehearsal (Supabase 17.11, W1 SQL, refusals; no skip)
        if: steps.rehearsals.outputs.full == 'true'
        run: node --test scripts/assess/grading-worker-image-rehearsal.test.mjs
      - run: npm run docs:test
      - name: Test first-version secret uploader (synthetic only)
        run: python3 -B -m unittest discover -s scripts/assess -p test_upload_worker_secret.py
      - name: Test W2/W3 credential transport (synthetic only, fake secret sink)
        run: python3 -B -m unittest discover -s scripts/assess -p test_rotate_grading_credential.py
      - name: Test W5 credential-free TLS probe (synthetic only)
        run: node --test scripts/assess/direct-tls-probe.test.mjs
      - name: Test read-only connection probe (synthetic only)
        run: node --test scripts/assess/connection-probe.test.mjs
      - name: Required DB lane including production fixture calibration in embedded and pinned Supabase 17.11 ICU (no skip)
        run: npm test
        env:
          CI_TEST_LANE: db
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the status transition check needs the fork point from the target branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run docs:check -- --base "$BASE_REF" --head "$HEAD_SHA"
          npm run status:check -- --base "$BASE_REF" --head "$HEAD_SHA" --require-previous
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the status transition check needs the fork point from the target branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:pages   # the static export used by the pilot preview (out/)
      - run: npm run health:sizes
        env:
          CODE_HEALTH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  check:
    name: check
    if: always()
    needs: [unit, db, docs, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require all four jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          expected = {'unit', 'db', 'docs', 'build'}
          ok = set(results) == expected and all(job['result'] == 'success' for job in results.values())
          if not ok:
              print({name: job['result'] for name, job in results.items()})
              sys.exit(1)
          PYTHON
