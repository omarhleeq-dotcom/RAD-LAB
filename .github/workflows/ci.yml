# Unit tests, typecheck, lint and production build only: no secrets, no Playwright, no deployment.
# The browser visual-regression matrix (scripts/qa/run-matrix.mjs) is run manually; see docs/session-5-qa.md.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:pages   # the static export used by the pilot preview (out/)
