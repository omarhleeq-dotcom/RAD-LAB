# Deploys the static export (out/) to Cloudflare Pages by direct upload.
# main -> production deploy; pull requests -> preview deploy on the PR branch.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them the deploy is skipped.
# Tests/Playwright are NOT run here (ci.yml covers them). See docs/DEPLOYMENT.md.
name: Deploy Pages
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  # One exact Wrangler release for both the project-create step and cloudflare/wrangler-action. Update only here.
  WRANGLER_VERSION: 4.148.0
concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # only to post/update the single preview-URL comment
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
    steps:
      - name: Check Cloudflare secrets
        id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not available (not set, or this is a fork PR). Nothing was deployed."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci
      # Verify reviewed static-frontend requirements, not dormant server-only migrations.
      # The contract rejects unknown SQL, changed DB boundaries and imports/calls into deferred backends.
      - name: Require verified pilot schema
        id: schema
        if: steps.gate.outputs.enabled == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PILOT_SCHEMA_VERIFIED: ${{ vars.PILOT_SCHEMA_VERIFIED }}
        run: node scripts/pages/pilot-schema-gate.mjs
      - name: Build static export
        if: steps.gate.outputs.enabled == 'true' && steps.schema.outcome == 'success'
        env:
          # Public project URL of the pilot's Supabase project (a repo *variable*, not a secret). Empty = no account backend, CSP unchanged.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          # The PUBLISHABLE key only (sb_publishable_…), also a repo variable. A secret key here fails the build (scripts/pages/headers.mjs).
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:pages
      - name: Ensure Pages project exists
        if: steps.gate.outputs.enabled == 'true' && steps.schema.outcome == 'success'
        run: |
          set +e
          out=$(npx --yes "wrangler@${WRANGLER_VERSION}" pages project create rad-lab --production-branch=main 2>&1)
          code=$?
          if [ $code -ne 0 ]; then
            if echo "$out" | grep -qi "already exist"; then
              echo "Pages project rad-lab already exists."
            else
              echo "$out"
              exit $code
            fi
          else
            echo "Created Pages project rad-lab."
          fi
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.gate.outputs.enabled == 'true' && steps.schema.outcome == 'success'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy out --project-name=rad-lab --branch=${{ env.DEPLOY_BRANCH }}
      - name: Comment preview URL on PR
        if: always() && steps.gate.outputs.enabled == 'true' && github.event_name == 'pull_request' && (steps.schema.outcome == 'failure' || steps.deploy.outcome == 'success')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SCHEMA_OUTCOME: ${{ steps.schema.outcome }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const marker = '<!-- rad-lab-pages-preview -->';
            const lines = [marker, '**Cloudflare Pages preview**', ''];
            if (process.env.SCHEMA_OUTCOME === 'failure') {
              lines.push('Preview deployment is blocked: the pilot database compatibility has not been verified for this project and the required frontend schema. Follow docs/PILOT_SUPABASE_SETUP.md before setting PILOT_SCHEMA_VERIFIED. No new preview was deployed; previous preview links do not prove compatibility.');
            } else {
              if (process.env.ALIAS_URL) lines.push(`- Branch preview: ${process.env.ALIAS_URL}`);
              if (process.env.DEPLOY_URL) lines.push(`- This commit: ${process.env.DEPLOY_URL}`);
              lines.push('', 'This publishes the static frontend only. Backend migrations and workers are not deployed by this workflow.');
              lines.push('', `Commit \`${context.sha.slice(0, 7)}\`. Educational prototype, access may be restricted by Cloudflare Access.`);
            }
            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
